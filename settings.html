<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВаффлеВиль — Настройки</title>
    <link rel="stylesheet" href="styles/indexStyle.css" />
    <link rel="stylesheet" href="styles/titleStyle.css" />
    <style>
        /* ===== СТИЛИ ДЛЯ НАСТРОЕК (не ломают шапку) ===== */
        .settings-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .settings-card {
            background: #fff9f0;
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
        }

            .settings-card h1 {
                font-size: 2rem;
                margin-bottom: 20px;
                border-left: 6px solid #d9822b;
                padding-left: 20px;
                color: #3e2a1f;
            }

        .settings-section {
            margin-bottom: 30px;
            border-bottom: 1px solid #ffe1bc;
            padding-bottom: 20px;
        }

            .settings-section h2 {
                font-size: 1.4rem;
                margin-bottom: 18px;
                color: #b45f2b;
            }

        .setting-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

            .setting-item label {
                font-weight: 600;
                width: 180px;
                color: #5a3a22;
            }

            .setting-item input, .setting-item select {
                flex: 1;
                padding: 10px 16px;
                border-radius: 60px;
                border: 1px solid #ffd7a5;
                background: white;
                font-size: 0.95rem;
                outline: none;
            }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 10px;
        }

            .checkbox-group label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: normal;
                cursor: pointer;
            }

        button.save-btn {
            background: #d9822b;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-right: 15px;
            transition: 0.2s;
        }

            button.save-btn:hover {
                background: #b45f2b;
                transform: scale(1.02);
            }

        button.reset-btn {
            background: #eedbbc;
            color: #5c371b;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            padding: 10px 20px;
            border-radius: 40px;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #b45f2b;
            text-decoration: none;
            font-weight: 500;
        }

            .back-link:hover {
                text-decoration: underline;
            }

        /* Стили корзины (копия из index.html, чтобы она работала) */
        #cartBtn {
            position: relative;
        }

        .cart-count-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e25822;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 30px;
            padding: 2px 7px;
            min-width: 20px;
            text-align: center;
            display: none;
            pointer-events: none;
        }

        .cart-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease;
        }

            .cart-modal-overlay.active {
                visibility: visible;
                opacity: 1;
            }

        .cart-modal {
            background: #fff9f0;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            font-family: system-ui, 'Segoe UI', sans-serif;
        }

        .cart-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 2px solid #ffdfb5;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .cart-close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #b45f2b;
        }

        .cart-items-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            margin: 8px 0;
            padding: 12px 16px;
            border-radius: 60px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .cart-item-info {
            flex: 2;
        }

        .cart-item-title {
            font-weight: 700;
        }

        .cart-item-price {
            font-size: 0.8rem;
            color: #a5622c;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-qty-btn {
            background: #f0dbbc;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-remove-item {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .cart-footer {
            padding: 16px 24px;
            border-top: 2px solid #ffdfb5;
            background: #fff3e4;
            border-radius: 0 0 32px 32px;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .cart-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .cart-clear-btn, .cart-checkout-btn {
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .cart-clear-btn {
            background: #eedbbc;
        }

        .cart-checkout-btn {
            background: #d9822b;
            color: white;
        }

        .cart-empty-msg {
            text-align: center;
            padding: 40px;
            color: #b48858;
        }
    </style>
</head>
<body>

    <!-- ========== ШАПКА (ТОЧНО ТАКАЯ ЖЕ, КАК НА ГЛАВНОЙ) ========= -->
    <header class="header">
        <div class="header-inner">
            <div class="header-left">
                <a href="/" class="logo-link">
                    <img src="image/logo.png" alt="Логотип ВаффлеВиль" class="logo-img">
                </a>
                <span class="brand-name">ВаффлеВиль</span>
            </div>
            <div class="header-center">
                <form class="search-form" action="/search" method="GET">
                    <input type="text" class="search-input" placeholder="Поиск вафель..." name="q">
                    <button type="submit" class="search-button">
                        <img src="image/loop.jpg" alt="Найти" class="search-icon">
                    </button>
                </form>
            </div>
            <div class="header-right">
                <button class="icon-btn about-btn" id="aboutBtn">
                    <img src="image/logo.png" alt="О нас" class="icon-img">
                </button>
                <button class="icon-btn" id="cartBtn">
                    <img src="image/logo.png" alt="Корзина" class="icon-img">
                    <span class="cart-count-badge" id="cartCountBadge">0</span>
                </button>
                <div class="dropdown">
                    <button class="icon-btn" id="menuBtn">
                        <img src="image/logo.png" alt="Меню" class="icon-img">
                    </button>
                    <div class="dropdown-content" id="dropdownMenu">
                        <a href="settings.html">⚙️ Настройки</a>
                        <a href="/delivery">🚚 Доставка</a>
                        <a href="/account">👤 Аккаунт</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ========== ОСНОВНОЙ КОНТЕНТ (НАСТРОЙКИ) ========= -->
    <div class="settings-container">
        <div class="settings-card">
            <h1>⚙️ Настройки профиля</h1>
            <div id="msgArea"></div>

            <div class="settings-section">
                <h2>Личные данные</h2>
                <div class="setting-item">
                    <label>Имя пользователя</label>
                    <input type="text" id="username" placeholder="Как вас называть">
                </div>
                <div class="setting-item">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="example@mail.ru">
                </div>
            </div>

            <div class="settings-section">
                <h2>Внешний вид</h2>
                <div class="setting-item">
                    <label>Тема оформления</label>
                    <select id="theme">
                        <option value="light">Светлая</option>
                        <option value="dark">Тёмная</option>
                        <option value="waffle">Вафельная (кремовая)</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <h2>Уведомления</h2>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="notifyEmail"> Получать новости на почту</label>
                    <label><input type="checkbox" id="notifyPromo"> Уведомления об акциях</label>
                    <label><input type="checkbox" id="notifyOrder"> Статус заказа (SMS/Email)</label>
                </div>
            </div>

            <div style="margin-top: 25px;">
                <button class="save-btn" id="saveBtn">💾 Сохранить настройки</button>
                <button class="reset-btn" id="resetBtn">🔄 Сбросить</button>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <a href="index.html" class="back-link">← Вернуться на главную</a>
            </div>
        </div>
    </div>

    <!-- ========== МОДАЛЬНОЕ ОКНО КОРЗИНЫ ========= -->
    <div class="cart-modal-overlay" id="cartModal">
        <div class="cart-modal">
            <div class="cart-modal-header">
                <span>🧺 Моя корзина</span>
                <button class="cart-close-btn" id="cartCloseBtn">&times;</button>
            </div>
            <div class="cart-items-list" id="cartItemsList">
                <div class="cart-empty-msg">Корзина пуста</div>
            </div>
            <div class="cart-footer">
                <div class="cart-total-row">
                    <span>Итого:</span>
                    <span id="cartTotalPrice">0 ₽</span>
                </div>
                <div class="cart-buttons">
                    <button class="cart-clear-btn" id="cartClearBtn">Очистить</button>
                    <button class="cart-checkout-btn" id="cartCheckoutBtn">Оформить заказ</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== КОРЗИНА (та же, что на главной) ==========
        let cart = [];

        function saveCart() { localStorage.setItem('waffle_cart', JSON.stringify(cart)); }
        function loadCart() {
        const saved = localStorage.getItem('waffle_cart');
        if (saved) { try { cart = JSON.parse(saved); } catch(e) { cart = []; } }
        else cart = [];
        renderCart(); updateCartBadge();
        }
        window.addToCart = function(id, name, price) {
        const existing = cart.find(item => item.id == id);
        if (existing) existing.quantity++;
        else cart.push({ id, name, price, quantity: 1 });
        saveCart(); renderCart(); updateCartBadge();
        };
        function changeQuantity(id, delta) {
        const idx = cart.findIndex(item => item.id == id);
        if (idx !== -1) {
        const newQty = cart[idx].quantity + delta;
        if (newQty <= 0) cart.splice(idx, 1);
        else cart[idx].quantity = newQty;
        saveCart(); renderCart(); updateCartBadge();
        }
        }
        function removeItem(id) { cart = cart.filter(item => item.id != id); saveCart(); renderCart(); updateCartBadge(); }
        function clearCart() { cart = []; saveCart(); renderCart(); updateCartBadge(); }
        function checkout() {
        if (!cart.length) { alert('Корзина пуста!'); return; }
        const total = cart.reduce((s,i) => s + i.price * i.quantity, 0);
        alert(`Спасибо за заказ! Сумма: ${total} ₽`);
        }
        function renderCart() {
        const container = document.getElementById('cartItemsList');
        const totalSpan = document.getElementById('cartTotalPrice');
        if (!container) return;
        if (!cart.length) {
        container.innerHTML = '<div class="cart-empty-msg">🧇 Ваша корзина пуста</div>';
        totalSpan.innerText = '0 ₽'; return;
        }
        let total = 0, html = '';
        cart.forEach(item => {
        total += item.price * item.quantity;
        html += `<div class="cart-item">
        <div class="cart-item-info">
        <div class="cart-item-title">${escapeHtml(item.name)}</div>
        <div class="cart-item-price">${item.price} ₽ × ${item.quantity}</div>
        </div>
        <div class="cart-item-actions">
        <button class="cart-qty-btn cart-dec" data-id="${item.id}">−</button>
        <span style="min-width:28px;text-align:center;">${item.quantity}</span>
        <button class="cart-qty-btn cart-inc" data-id="${item.id}">+</button>
        <button class="cart-remove-item" data-id="${item.id}">🗑️</button>
        </div>
        </div>`;
        });
        container.innerHTML = html;
        totalSpan.innerText = `${total} ₽`;
        document.querySelectorAll('.cart-dec').forEach(btn => btn.onclick = () => changeQuantity(parseInt(btn.dataset.id), -1));
        document.querySelectorAll('.cart-inc').forEach(btn => btn.onclick = () => changeQuantity(parseInt(btn.dataset.id), 1));
        document.querySelectorAll('.cart-remove-item').forEach(btn => btn.onclick = () => removeItem(parseInt(btn.dataset.id)));
        }
        function updateCartBadge() {
        const badge = document.getElementById('cartCountBadge');
        if (badge) {
        const totalQty = cart.reduce((s,i) => s + i.quantity, 0);
        badge.innerText = totalQty;
        badge.style.display = totalQty ? 'flex' : 'none';
        }
        }
        function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

        const modal = document.getElementById('cartModal');
        document.getElementById('cartBtn').onclick = () => { renderCart(); modal.classList.add('active'); };
        document.getElementById('cartCloseBtn').onclick = () => modal.classList.remove('active');
        modal.onclick = e => { if (e.target === modal) modal.classList.remove('active'); };
        document.getElementById('cartClearBtn').onclick = clearCart;
        document.getElementById('cartCheckoutBtn').onclick = checkout;
        loadCart();

        // ========== ЛОГИКА НАСТРОЕК ==========
        const defaultSettings = {
        username: '', email: '', theme: 'light',
        notifyEmail: false, notifyPromo: false, notifyOrder: false
        };
        function loadSettings() {
        const saved = localStorage.getItem('waffle_settings');
        const settings = saved ? { ...defaultSettings, ...JSON.parse(saved) } : defaultSettings;
        document.getElementById('username').value = settings.username;
        document.getElementById('email').value = settings.email;
        document.getElementById('theme').value = settings.theme;
        document.getElementById('notifyEmail').checked = settings.notifyEmail;
        document.getElementById('notifyPromo').checked = settings.notifyPromo;
        document.getElementById('notifyOrder').checked = settings.notifyOrder;
        applyTheme(settings.theme);
        }
        function saveSettings() {
        const settings = {
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        theme: document.getElementById('theme').value,
        notifyEmail: document.getElementById('notifyEmail').checked,
        notifyPromo: document.getElementById('notifyPromo').checked,
        notifyOrder: document.getElementById('notifyOrder').checked
        };
        localStorage.setItem('waffle_settings', JSON.stringify(settings));
        applyTheme(settings.theme);
        showMessage('Настройки сохранены!', 'success');
        }
        function resetSettings() {
        localStorage.removeItem('waffle_settings');
        loadSettings();
        showMessage('Настройки сброшены', 'success');
        }
        function applyTheme(theme) {
        const body = document.body;
        if (theme === 'dark') {
        body.style.backgroundColor = '#2c2c2c';
        body.style.color = '#f0f0f0';
        document.querySelectorAll('.settings-card, .header').forEach(el => {
        if (el) { el.style.backgroundColor = '#3a3a3a'; el.style.color = '#eee'; }
        });
        } else if (theme === 'waffle') {
        body.style.backgroundColor = '#fef2df';
        body.style.color = '#4a2e1a';
        document.querySelectorAll('.settings-card, .header').forEach(el => {
        if (el) { el.style.backgroundColor = '#fff1e0'; el.style.color = '#4a2e1a'; }
        });
        } else {
        body.style.backgroundColor = '';
        body.style.color = '';
        document.querySelectorAll('.settings-card, .header').forEach(el => {
        if (el) { el.style.backgroundColor = ''; el.style.color = ''; }
        });
        }
        }
        function showMessage(msg, type) {
        const area = document.getElementById('msgArea');
        area.innerHTML = `<div class="message ${type}">${msg}</div>`;
        setTimeout(() => area.innerHTML = '', 3000);
        }
        document.getElementById('saveBtn').onclick = saveSettings;
        document.getElementById('resetBtn').onclick = resetSettings;
        loadSettings();
    </script>
</body>
</html>
