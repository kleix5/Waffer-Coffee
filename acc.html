<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВаффлеВиль — магазин вафель</title>
    <link rel="stylesheet" href="styles/indexStyle.css" />
    <!-- ===== СТИЛИ ДЛЯ КОРЗИНЫ ===== -->
    <style>
        /* Позиционирование бейджа только для кнопки корзины */
        #cartBtn {
            position: relative;
        }

        .cart-count-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e25822;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 30px;
            padding: 2px 7px;
            min-width: 20px;
            text-align: center;
            display: none;
            pointer-events: none;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        /* Модальное окно корзины */
        .cart-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease;
        }

            .cart-modal-overlay.active {
                visibility: visible;
                opacity: 1;
            }

        .cart-modal {
            background: #fff9f0;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            font-family: system-ui, 'Segoe UI', sans-serif;
        }

        .cart-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 2px solid #ffdfb5;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .cart-close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #b45f2b;
        }

        .cart-items-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            margin: 8px 0;
            padding: 12px 16px;
            border-radius: 60px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .cart-item-info {
            flex: 2;
        }

        .cart-item-title {
            font-weight: 700;
        }

        .cart-item-price {
            font-size: 0.8rem;
            color: #a5622c;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-qty-btn {
            background: #f0dbbc;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .cart-remove-item {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .cart-footer {
            padding: 16px 24px;
            border-top: 2px solid #ffdfb5;
            background: #fff3e4;
            border-radius: 0 0 32px 32px;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .cart-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .cart-clear-btn, .cart-checkout-btn {
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .cart-clear-btn {
            background: #eedbbc;
        }

        .cart-checkout-btn {
            background: #d9822b;
            color: white;
        }

        .cart-empty-msg {
            text-align: center;
            padding: 40px;
            color: #b48858;
        }

        /* Модальное окно регистрации/входа*/
        .auth-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease;
        }

            .auth-modal-overlay.active {
                visibility: visible;
                opacity: 1;
            }

        .auth-modal {
            background: #fff9f0;
            width: 90%;
            max-width: 460px;
            border-radius: 40px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 2px solid #ffdfb5;
            background: #fff5ea;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 16px 0;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            color: #b97f4b;
            background: none;
            border: none;
        }

            .auth-tab.active {
                color: #d9822b;
                border-bottom: 3px solid #d9822b;
                background: #ffffffd9;
            }

        .auth-form-container {
            padding: 28px 28px 36px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

            .auth-form.hidden {
                display: none;
            }

            .auth-form input {
                padding: 14px 18px;
                border: 1.5px solid #f0dbbc;
                border-radius: 60px;
                font-size: 1rem;
                background: white;
                outline: none;
            }

                .auth-form input:focus {
                    border-color: #d9822b;
                }

        .auth-btn {
            background: #d9822b;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
        }

            .auth-btn:hover {
                background: #bf6f1f;
            }

        .auth-message {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 12px;
            color: #bc6f2c;
        }

        .close-auth {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 32px;
            background: none;
            border: none;
            cursor: pointer;
            color: #b45f2b;
        }

        .auth-modal-header {
            position: relative;
            background: #fff5ea;
        }
    </style>
</head>
<body>

    <!-- ===== ШАПКА САЙТА ===== -->
    <header class="header">
        <div class="header-inner">
            <!-- Левая часть: логотип + текст -->
            <div class="header-left">
                <a href="/" class="logo-link">
                    <img src="image/logo.png" alt="Логотип ВаффлеВиль" class="logo-img">
                </a>
                <span class="brand-name">ВаффлеВиль</span>
            </div>

            <!-- Поиск -->
            <div class="header-center">
                <form class="search-form" action="/search" method="GET">
                    <input type="text" class="search-input" placeholder="Поиск вафель..." name="q">
                    <button type="submit" class="search-button">
                        <img src="image/loop.jpg" alt="Найти" class="search-icon">
                    </button>
                </form>
            </div>

            <!-- Правая часть -->
            <div class="header-right">
                <button class="icon-btn about-btn" id="aboutBtn">
                    <img src="image/logo.png" alt="О нас" class="icon-img">
                </button>
                <button class="icon-btn" id="cartBtn">
                    <img src="image/logo.png" alt="Корзина" class="icon-img">
                    <span class="cart-count-badge" id="cartCountBadge">0</span>
                </button>
                <div class="dropdown">
                    <button class="icon-btn" id="menuBtn">
                        <img src="image/logo.png" alt="Меню" class="icon-img">
                    </button>
                    <div class="dropdown-content" id="dropdownMenu">
                        <a href="/settings">⚙️ Настройки</a>
                        <a href="/delivery">🚚 Доставка</a>
                        <a href="#" id="accountLink">👤 Аккаунт</a>
                        <a href="#" id="logoutLink" style="display: none;">🚪 Выйти</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="content">
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО КОРЗИНЫ ===== -->
    <div class="cart-modal-overlay" id="cartModal">
        <div class="cart-modal">
            <div class="cart-modal-header">
                <span> Моя корзина</span>
                <button class="cart-close-btn" id="cartCloseBtn">&times;</button>
            </div>
            <div class="cart-items-list" id="cartItemsList">
                <div class="cart-empty-msg">Корзина пуста</div>
            </div>
            <div class="cart-footer">
                <div class="cart-total-row">
                    <span>Итого:</span>
                    <span id="cartTotalPrice">0 ₽</span>
                </div>
                <div class="cart-buttons">
                    <button class="cart-clear-btn" id="cartClearBtn">Очистить</button>
                    <button class="cart-checkout-btn" id="cartCheckoutBtn">Оформить заказ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО РЕГИСТРАЦИИ / ВХОДА -->
    <div class="auth-modal-overlay" id="authModal">
        <div class="auth-modal">
            <div class="auth-modal-header">
                <div class="auth-tabs">
                    <button class="auth-tab" data-tab="login">🍬 Вход</button>
                    <button class="auth-tab active" data-tab="register">✨ Регистрация</button>
                </div>
                <button class="close-auth" id="closeAuthBtn">&times;</button>
            </div>
            <div class="auth-form-container">
                <div id="loginForm" class="auth-form hidden">
                    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
                    <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
                    <button class="auth-btn" id="doLoginBtn">Войти</button>
                    <div class="auth-message" id="loginMessage"></div>
                </div>
                <div id="registerForm" class="auth-form">
                    <input type="text" id="regName" placeholder="Имя" autocomplete="name">
                    <input type="email" id="regEmail" placeholder="Email" autocomplete="email">
                    <input type="password" id="regPassword" placeholder="Пароль (минимум 6 символов)">
                    <input type="password" id="regConfirm" placeholder="Подтвердите пароль">
                    <button class="auth-btn" id="doRegisterBtn">Зарегистрироваться</button>
                    <div class="auth-message" id="registerMessage"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/indexScript.js"></script>

    <script>
        // ---------- КОРЗИНА (оригинальный код, без изменений) ----------
        let cart = [];

        function saveCart() {
        localStorage.setItem('waffle_cart', JSON.stringify(cart));
        }
        function loadCart() {
        const saved = localStorage.getItem('waffle_cart');
        if (saved) {
        try {
        cart = JSON.parse(saved);
        } catch(e) { cart = []; }
        } else cart = [];
        renderCart();
        updateCartBadge();
        }

        window.addToCart = function(id, name, price) {
        const existing = cart.find(item => item.id == id);
        if (existing) {
        existing.quantity++;
        } else {
        cart.push({ id: id, name: name, price: price, quantity: 1 });
        }
        saveCart();
        renderCart();
        updateCartBadge();
        };

        function changeQuantity(id, delta) {
        const idx = cart.findIndex(item => item.id == id);
        if (idx !== -1) {
        const newQty = cart[idx].quantity + delta;
        if (newQty <= 0) {
        cart.splice(idx, 1);
        } else {
        cart[idx].quantity = newQty;
        }
        saveCart();
        renderCart();
        updateCartBadge();
        }
        }

        function removeItem(id) {
        cart = cart.filter(item => item.id != id);
        saveCart();
        renderCart();
        updateCartBadge();
        }

        function clearCart() {
        cart = [];
        saveCart();
        renderCart();
        updateCartBadge();
        }

        function checkout() {
        if (cart.length === 0) {
        alert('Корзина пуста. Добавьте вафли!');
        return;
        }
        const total = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
        alert(`Спасибо за заказ!\nСумма: ${total} ₽\nВаши вафли скоро будут готовы.`);
        }

        function renderCart() {
        const container = document.getElementById('cartItemsList');
        const totalSpan = document.getElementById('cartTotalPrice');
        if (!container) return;

        if (cart.length === 0) {
        container.innerHTML = '<div class="cart-empty-msg">Ваша корзина пуста</div>';
        totalSpan.innerText = '0 ₽';
        return;
        }

        let total = 0;
        let html = '';
        cart.forEach(item => {
        total += item.price * item.quantity;
        html += `
        <div class="cart-item">
        <div class="cart-item-info">
        <div class="cart-item-title">${escapeHtml(item.name)}</div>
        <div class="cart-item-price">${item.price} ₽ × ${item.quantity}</div>
        </div>
        <div class="cart-item-actions">
        <button class="cart-qty-btn cart-dec" data-id="${item.id}">−</button>
        <span style="min-width: 28px; text-align:center;">${item.quantity}</span>
        <button class="cart-qty-btn cart-inc" data-id="${item.id}">+</button>
        <button class="cart-remove-item" data-id="${item.id}">🗑️</button>
        </div>
        </div>
        `;
        });
        container.innerHTML = html;
        totalSpan.innerText = `${total} ₽`;

        document.querySelectorAll('.cart-dec').forEach(btn => {
        btn.addEventListener('click', (e) => {
        const id = parseInt(btn.dataset.id);
        changeQuantity(id, -1);
        });
        });
        document.querySelectorAll('.cart-inc').forEach(btn => {
        btn.addEventListener('click', (e) => {
        const id = parseInt(btn.dataset.id);
        changeQuantity(id, 1);
        });
        });
        document.querySelectorAll('.cart-remove-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
        const id = parseInt(btn.dataset.id);
        removeItem(id);
        });
        });
        }

        function updateCartBadge() {
        const badge = document.getElementById('cartCountBadge');
        if (badge) {
        const totalQty = cart.reduce((sum, i) => sum + i.quantity, 0);
        badge.innerText = totalQty;
        badge.style.display = totalQty > 0 ? 'flex' : 'none';
        }
        }

        function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
        });
        }

        // Управление модальным окном корзины
        const modal = document.getElementById('cartModal');
        function openCart() {
        renderCart();
        modal.classList.add('active');
        }
        function closeCart() {
        modal.classList.remove('active');
        }

        // ---------- СИСТЕМА РЕГИСТРАЦИИ/АККАУНТА ----------
        const USERS_KEY = 'waffle_users';
        const CURRENT_USER_KEY = 'waffle_current_user';

        function loadUsers() {
        const stored = localStorage.getItem(USERS_KEY);
        try { return stored ? JSON.parse(stored) : []; } catch(e) { return []; }
        }
        function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
        function setCurrentUser(user) {
        if (user) localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
        else localStorage.removeItem(CURRENT_USER_KEY);
        updateUIForAuth();
        }
        function getCurrentUser() {
        const raw = localStorage.getItem(CURRENT_USER_KEY);
        try { return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
        }
        function updateUIForAuth() {
        const user = getCurrentUser();
        const logoutLink = document.getElementById('logoutLink');
        const accountLink = document.getElementById('accountLink');
        const dropdownMenu = document.getElementById('dropdownMenu');
        let greetingItem = document.getElementById('greetingMenuItem');
        if (user) {
        if (!greetingItem) {
        greetingItem = document.createElement('div');
        greetingItem.id = 'greetingMenuItem';
        greetingItem.style.cssText = 'padding: 8px 16px; font-size: 0.85rem; background: #ffefdb; border-radius: 30px; margin: 6px 12px; text-align: center; color: #9b5a2c;';
        dropdownMenu.insertBefore(greetingItem, dropdownMenu.firstChild);
        }
        greetingItem.innerHTML = `🍯 Привет, ${escapeHtml(user.name || user.email.split('@')[0])}!`;
        if (logoutLink) logoutLink.style.display = 'block';
        if (accountLink) accountLink.innerHTML = '👤 Мой профиль';
        } else {
        if (greetingItem) greetingItem.remove();
        if (logoutLink) logoutLink.style.display = 'none';
        if (accountLink) accountLink.innerHTML = '👤 Аккаунт';
        }
        }
        function registerUser(name, email, password, confirm) {
        const msgDiv = document.getElementById('registerMessage');
        if (!name.trim()) { msgDiv.innerText = '❌ Введите имя'; return false; }
        if (!email.trim() || !email.includes('@')) { msgDiv.innerText = '❌ Введите корректный email'; return false; }
        if (password.length < 6) { msgDiv.innerText = '❌ Пароль должен быть не менее 6 символов'; return false; }
        if (password !== confirm) { msgDiv.innerText = '❌ Пароли не совпадают'; return false; }
        const users = loadUsers();
        if (users.find(u => u.email === email)) { msgDiv.innerText = '❌ Пользователь с таким email уже существует'; return false; }
        const newUser = { id: Date.now(), name: name.trim(), email: email.trim(), password: password };
        users.push(newUser);
        saveUsers(users);
        setCurrentUser({ id: newUser.id, name: newUser.name, email: newUser.email });
        msgDiv.innerText = '✅ Регистрация успешна!';
        setTimeout(() => { closeAuthModal(); msgDiv.innerText = ''; document.getElementById('regName').value = ''; document.getElementById('regEmail').value = ''; document.getElementById('regPassword').value = ''; document.getElementById('regConfirm').value = ''; }, 1200);
        return true;
        }
        function loginUser(email, password) {
        const msgDiv = document.getElementById('loginMessage');
        if (!email.trim() || !password) { msgDiv.innerText = '❌ Заполните поля'; return false; }
        const users = loadUsers();
        const user = users.find(u => u.email === email && u.password === password);
        if (!user) { msgDiv.innerText = '❌ Неверный email или пароль'; return false; }
        setCurrentUser({ id: user.id, name: user.name, email: user.email });
        msgDiv.innerText = '✅ Вход выполнен!';
        setTimeout(() => { closeAuthModal(); msgDiv.innerText = ''; document.getElementById('loginEmail').value = ''; document.getElementById('loginPassword').value = ''; }, 1000);
        return true;
        }
        function logoutUser() { setCurrentUser(null); alert('👋 Вы вышли из аккаунта'); closeAuthModal(); }

        const authModalOverlay = document.getElementById('authModal');
        function openAuthModal() {
        if (getCurrentUser()) { alert(`Вы уже вошли как ${getCurrentUser().name}. Чтобы сменить аккаунт, выйдите.`); return; }
        document.getElementById('registerMessage').innerText = '';
        document.getElementById('loginMessage').innerText = '';
        document.getElementById('regName').value = ''; document.getElementById('regEmail').value = ''; document.getElementById('regPassword').value = ''; document.getElementById('regConfirm').value = '';
        document.getElementById('loginEmail').value = ''; document.getElementById('loginPassword').value = '';
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelector('.auth-tab[data-tab="register"]').classList.add('active');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('loginForm').classList.add('hidden');
        authModalOverlay.classList.add('active');
        }
        function closeAuthModal() { authModalOverlay.classList.remove('active'); }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
        loadCart();

        const cartBtn = document.getElementById('cartBtn');
        if (cartBtn) cartBtn.addEventListener('click', openCart);
        const closeBtn = document.getElementById('cartCloseBtn');
        if (closeBtn) closeBtn.addEventListener('click', closeCart);
        modal.addEventListener('click', (e) => {
        if (e.target === modal) closeCart();
        });
        const clearBtn = document.getElementById('cartClearBtn');
        if (clearBtn) clearBtn.addEventListener('click', clearCart);
        const checkoutBtn = document.getElementById('cartCheckoutBtn');
        if (checkoutBtn) checkoutBtn.addEventListener('click', checkout);

        // Аккаунт
        const accountLink = document.getElementById('accountLink');
        if (accountLink) accountLink.addEventListener('click', (e) => { e.preventDefault(); openAuthModal(); });
        const logoutLink = document.getElementById('logoutLink');
        if (logoutLink) logoutLink.addEventListener('click', (e) => { e.preventDefault(); logoutUser(); });
        const closeAuth = document.getElementById('closeAuthBtn');
        if (closeAuth) closeAuth.addEventListener('click', closeAuthModal);
        authModalOverlay.addEventListener('click', (e) => { if (e.target === authModalOverlay) closeAuthModal(); });
        const regBtn = document.getElementById('doRegisterBtn');
        if (regBtn) regBtn.addEventListener('click', () => {
        const name = document.getElementById('regName').value, email = document.getElementById('regEmail').value, pwd = document.getElementById('regPassword').value, conf = document.getElementById('regConfirm').value;
        registerUser(name, email, pwd, conf);
        });
        const loginBtn = document.getElementById('doLoginBtn');
        if (loginBtn) loginBtn.addEventListener('click', () => {
        const email = document.getElementById('loginEmail').value, pwd = document.getElementById('loginPassword').value;
        loginUser(email, pwd);
        });
        // Переключение табов
        document.querySelectorAll('.auth-tab').forEach(tab => {
        tab.addEventListener('click', () => {
        const target = tab.dataset.tab;
        if (target === 'login') {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        }
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('registerMessage').innerText = '';
        document.getElementById('loginMessage').innerText = '';
        });
        });
        updateUIForAuth();

        // Демо-кнопки (если будут добавлены)
        document.querySelectorAll('.demo-btn').forEach(btn => {
        btn.addEventListener('click', () => {
        const id = parseInt(btn.dataset.id);
        const name = btn.dataset.name;
        const price = parseInt(btn.dataset.price);
        window.addToCart(id, name, price);
        });
        });
        });
    </script>
</body>
</html>
