<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВаффлеВиль — магазин вафель</title>
    <link rel="stylesheet" href="styles/indexStyle.css" />
    <link rel="stylesheet" href="styles/cartStyle.css" />
    <link rel="stylesheet" href="styles/accStyle.css" />
</head>
<body>

    <!-- ===== ШАПКА САЙТА ===== -->
    <header class="header">
        <div class="header-inner">
            <!-- Левая часть: логотип + текст -->
            <div class="header-left">
                <a href="/" class="logo-link">
                    <img src="image/logo.png" alt="Логотип ВаффлеВиль" class="logo-img">
                </a>
                <span class="brand-name">ВаффлеВиль</span>
            </div>

            <!-- Поиск -->
            <div class="header-center">
                <form class="search-form" action="/search" method="GET">
                    <input type="text" class="search-input" placeholder="Поиск вафель..." name="q">
                    <button type="submit" class="search-button">
                        <img src="image/loop.jpg" alt="Найти" class="search-icon">
                    </button>
                </form>
            </div>

            <!-- Правая часть -->
            <div class="header-right">
                <button class="icon-btn about-btn" id="aboutBtn">
                    <img src="image/logo.png" alt="О нас" class="icon-img">
                </button>
                <button class="icon-btn" id="cartBtn">
                    <img src="image/logo.png" alt="Корзина" class="icon-img">
                    <span class="cart-count-badge" id="cartCountBadge">0</span>
                </button>
                <div class="dropdown">
                    <button class="icon-btn" id="menuBtn">
                        <img src="image/logo.png" alt="Меню" class="icon-img">
                    </button>
                    <div class="dropdown-content" id="dropdownMenu">
                        <a href="/settings">⚙️ Настройки</a>
                        <a href="/delivery">🚚 Доставка</a>
                        <a href="#" id="accountLink">👤 Аккаунт</a>
                        <a href="#" id="logoutLink" style="display: none;">🚪 Выйти</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="content">
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО КОРЗИНЫ ===== -->
    <div class="cart-modal-overlay" id="cartModal">
        <div class="cart-modal">
            <div class="cart-modal-header">
                <span> Моя корзина</span>
                <button class="cart-close-btn" id="cartCloseBtn">&times;</button>
            </div>
            <div class="cart-items-list" id="cartItemsList">
                <div class="cart-empty-msg">Корзина пуста</div>
            </div>
            <div class="cart-footer">
                <div class="cart-total-row">
                    <span>Итого:</span>
                    <span id="cartTotalPrice">0 ₽</span>
                </div>
                <div class="cart-buttons">
                    <button class="cart-clear-btn" id="cartClearBtn">Очистить</button>
                    <button class="cart-checkout-btn" id="cartCheckoutBtn">Оформить заказ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО РЕГИСТРАЦИИ / ВХОДА -->
    <div class="auth-modal-overlay" id="authModal">
        <div class="auth-modal">
            <div class="auth-modal-header">
                <div class="auth-tabs">
                    <button class="auth-tab" data-tab="login">🍬 Вход</button>
                    <button class="auth-tab active" data-tab="register">✨ Регистрация</button>
                </div>
                <button class="close-auth" id="closeAuthBtn">&times;</button>
            </div>
            <div class="auth-form-container">
                <div id="loginForm" class="auth-form hidden">
                    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
                    <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
                    <button class="auth-btn" id="doLoginBtn">Войти</button>
                    <div class="auth-message" id="loginMessage"></div>
                </div>
                <div id="registerForm" class="auth-form">
                    <input type="text" id="regName" placeholder="Имя" autocomplete="name">
                    <input type="email" id="regEmail" placeholder="Email" autocomplete="email">
                    <input type="password" id="regPassword" placeholder="Пароль (минимум 6 символов)">
                    <input type="password" id="regConfirm" placeholder="Подтвердите пароль">
                    <button class="auth-btn" id="doRegisterBtn">Зарегистрироваться</button>
                    <div class="auth-message" id="registerMessage"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/indexScript.js"></script>
    <script src="scripts/cartScript.js"></script>
    <script src="scripts/accScript.js"></script>
</body>
</html>
